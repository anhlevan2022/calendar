<html>
<head>
<title>Ho Ngoc Duc's Lunar Calendar</title>
<style type="text/css">
#allbg {font-family: 'Arial',Verdana,Georgia;margin: 0 auto 0;width:98%;min-height:250px;padding:4px;background-color:#FFFFCC;box-shadow: 3px 3px 2px #888;line-height:1.6}
.dongho {text-align:center;font-size:110%;font-weight:600;color:#9917db;letter-spacing:1.5px}
.ngayduong{text-align:center;font-size:150%;font-weight:bold;color:blue;padding-top:10px}
.ngaythangduong{text-align:center;font-size:120%;font-weight:bold;color:#000}
.thuduong{text-align:center;font-weight:bold;text-decoration:underline}
.thangnamam{text-align:center;color:black;font-size:110%;line-height:2.5}
.ngayam{text-align:center;font-size:260%;font-weight:bold;animation:myfirst 15s;animation-iteration-count: infinite;-webkit-animation:myfirst 15s;-webkit-animation-iteration-count: infinite;padding: 5px 0 5px}
@keyframes myfirst {
  0% {color: hsl(  10, 90%, 60% );}
  6% {color: hsl(  30, 90%, 60% );}
  12% {color: hsl(  50, 90%, 60% );}
  18% {color:hsl(  70, 90%, 60% );}
  24% {color:hsl(  90, 90%, 60% );}
  30% {color:hsl( 110, 90%, 60% );}
  36% {color:hsl( 130, 90%, 60% );}
  42% {color:hsl( 150, 90%, 60% );}
  48% {color:hsl( 170, 90%, 60% );}
  54% {color:hsl( 190, 90%, 60% );}
  60% {color:hsl( 210, 90%, 60% );}
  66% {color:hsl( 230, 90%, 60% );}
  72% {color:hsl( 250, 90%, 60% );}
  78% {color:hsl( 270, 90%, 60% );}
  84% {color:hsl( 290, 90%, 60% );}
  90% {color:hsl( 310, 90%, 60% );}
  96% {color:hsl( 330, 90%, 60% );}
  100% {color:hsl( 350, 90%, 60% );}
}
@-webkit-keyframes myfirst {
  0% {color: hsl(  10, 90%, 60% );}
  6% {color: hsl(  30, 90%, 60% );}
  12% {color: hsl(  50, 90%, 60% );}
  18% {color:hsl(  70, 90%, 60% );}
  24% {color:hsl(  90, 90%, 60% );}
  30% {color:hsl( 110, 90%, 60% );}
  36% {color:hsl( 130, 90%, 60% );}
  42% {color:hsl( 150, 90%, 60% );}
  48% {color:hsl( 170, 90%, 60% );}
  54% {color:hsl( 190, 90%, 60% );}
  60% {color:hsl( 210, 90%, 60% );}
  66% {color:hsl( 230, 90%, 60% );}
  72% {color:hsl( 250, 90%, 60% );}
  78% {color:hsl( 270, 90%, 60% );}
  84% {color:hsl( 290, 90%, 60% );}
  90% {color:hsl( 310, 90%, 60% );}
  96% {color:hsl( 330, 90%, 60% );}
  100% {color:hsl( 350, 90%, 60% );}
}
.gioam {color:#0c3d0c;line-height:1.9;padding: 5px 0 0 10px}
.canchi {vertical-align:top}
.normal {vertical-align:top;line-height:100%}
.hoangdao {font-size:100%}
.info {text-align:center;font-size:80%}
</style>
</head>
<body>
<div id="allbg">
<div style="font-family:Times New Roman;text-align:center;font-size:130%;font-weight:bold;color:red;text-shadow: 3px 3px 2px #808080;padding: 8px 0">LỊCH VIỆT NAM</div>
<table class="thang" width="100%" border="0" cellpadding="0" cellspacing="0">
	<tr>
	 <td id="gio" class="dongho" style="border:0"></td>
	 <td id="thu" class="ngaythangduong" style="border:0"></td>
	</tr>
	<tr>
	 <td colspan="2" id="ngayduong" class="ngayduong" style="border:0"></td>
	</tr>
	<tr>
     <td colspan="2" id="dayinfo" class="info" style="border:0"></td>
	</tr>
	<tr>
	 <td style="border:0">
	   <div id="thangam" class="thangnamam"></div>
	   <div id="ngayam" class="ngayam"></div>
	   <div id="namam" class="thangnamam"></div>
	 </td>
	 <td class="canchi" style="border:0">
	  <div id="canchithang" class="gioam"></div>
	  <div id="canchingay" class="gioam"></div>
	  <div id="canchigio" class="gioam"></div>
	  <div id="tietkhi" class="gioam"></div>
	 </td>
	</tr>
</table>
</div>
<script language="JavaScript" src="https://anhlevan2022.github.io/calendar/LichNgayVN.js" type="text/javascript"></script>
<script language="JavaScript">

	showDateTime();
//-->
</script>
</body>
</html>
